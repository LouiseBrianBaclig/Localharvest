<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Favicons -->
  <link rel="icon" type="image/x-icon"    href="favicon.ico">
  <link rel="icon" type="image/svg+xml"   href="favicon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="favicon-512.png">
  <link rel="apple-touch-icon" sizes="180x180"      href="apple-touch-icon.png">
  <meta name="theme-color" content="#1a5c38">
  <title>Login – LocalHarvest</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600;700;800&family=Open+Sans:wght@400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>

<body data-page="login">
  <nav class="navbar" id="navbar">
    <div class="nav-container">
      <div class="nav-brand"><a href="index.html"><span class="brand-icon">🌾</span><span
            class="brand-name">LocalHarvest</span></a></div>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">← Back to Home</a></li>
      </ul>
    </div>
  </nav>

  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-header">
        <span class="brand-icon">🌾</span>
        <h1>Welcome Back</h1>
        <p>Login to continue to LocalHarvest</p>
      </div>

      <p
        style="font-family:'Raleway',sans-serif;font-weight:700;font-size:0.9rem;color:var(--green-dark);margin-bottom:0.75rem;">
        Login as:</p>
      <div class="role-selector">
        <button class="role-btn" data-role="farmer">
          <span class="role-icon">🌾</span>
          <span class="role-label">Farmer</span>
          <span class="role-desc">Manage my listings</span>
        </button>
        <button class="role-btn active" data-role="buyer">
          <span class="role-icon">🛒</span>
          <span class="role-label">Buyer</span>
          <span class="role-desc">Browse &amp; order produce</span>
        </button>
      </div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="loginEmail">Email Address</label>
          <input type="email" id="loginEmail" class="form-control" placeholder="you@email.com" autocomplete="email">
          <div class="form-error" id="loginEmailError">Please enter your email.</div>
        </div>
        <div class="form-group">
          <label for="loginPass">Password</label>
          <div class="password-wrapper">
            <input type="password" id="loginPass" class="form-control" placeholder="Your password" autocomplete="current-password">
            <button type="button" class="toggle-password" data-target="loginPass" tabindex="-1"><i class="fas fa-eye"></i></button>
          </div>
        </div>
        <div style="text-align:right;margin-bottom:1rem;">
          <a href="#" style="font-size:0.85rem;color:var(--green-med);font-weight:600;">Forgot password?</a>
        </div>
        <button type="submit" class="btn btn-green btn-block">
          <i class="fas fa-sign-in-alt"></i> Login
        </button>
      </form>

      <div style="text-align:center;margin:1.25rem 0;position:relative;">
        <div style="position:absolute;top:50%;left:0;right:0;height:1px;background:var(--green-pale);"></div>
        <span style="position:relative;background:white;padding:0 0.75rem;font-size:0.82rem;color:var(--text-light);">or
          try demo</span>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.75rem;margin-bottom:1rem;">
        <button onclick="demoLogin('farmer')" class="btn btn-secondary"
          style="justify-content:center;font-size:0.88rem;padding:0.7rem;">
          🌾 Demo Farmer
        </button>
        <button onclick="demoLogin('buyer')" class="btn btn-secondary"
          style="justify-content:center;font-size:0.88rem;padding:0.7rem;">
          🛒 Demo Buyer
        </button>
      </div>

      <div class="auth-footer">
        No account yet? <a href="register.html">Register here</a>
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    function demoLogin(role) {
      const demos = {
        farmer: { name: 'Mang Pedro Santos', email: 'pedro@localharvest.ph', location: 'Toril, Davao City', phone: '09171234567', role: 'farmer', id: 9001 },
        buyer: { name: 'Maria Dela Cruz', email: 'maria@email.com', location: 'Davao City', phone: '09189876543', role: 'buyer', id: 9002 }
      };
      setCurrentUser(demos[role]);
      showToast(`Welcome, ${demos[role].name.split(' ')[0]}! 🌾`);
      setTimeout(() => window.location.href = role === 'farmer' ? 'farmer-dashboard.html' : 'browse.html', 1000);
    }
  </script>
</body>

</html>
