<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile – LocalHarvest</title>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600;700;800&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="profile">

  <nav class="navbar">
    <div class="nav-container">
      <div class="nav-brand"><a href="index.html"><span class="brand-icon">🌾</span><span class="brand-name">LocalHarvest</span></a></div>
      <button class="nav-toggle" id="navToggle"><i class="fas fa-bars"></i></button>
      <ul class="nav-links" id="navLinks">
        <li><a href="browse.html">Browse</a></li>
        <li><button id="logoutBtn" class="nav-btn btn-outline" style="background:none;cursor:pointer;">Logout</button></li>
      </ul>
    </div>
  </nav>

  <div class="profile-page">
    <div class="profile-card">
      <div class="profile-header-card">
        <div class="profile-avatar">
          <span id="profileAvatarInitial" style="font-family:'Raleway',sans-serif;font-weight:800;font-size:2rem;color:var(--white);">M</span>
        </div>
        <div class="profile-name" id="profileName">Loading...</div>
        <div class="profile-role" id="profileRole">Buyer</div>
      </div>

      <div class="profile-info-card">
        <h3 style="font-family:'Raleway',sans-serif;font-size:1rem;font-weight:700;color:var(--green-dark);margin-bottom:1rem;">Account Information</h3>
        <div class="info-row">
          <span class="info-label"><i class="fas fa-user" style="margin-right:0.4rem;color:var(--green-light);"></i>Full Name</span>
          <span class="info-value" id="infoName">—</span>
        </div>
        <div class="info-row">
          <span class="info-label"><i class="fas fa-envelope" style="margin-right:0.4rem;color:var(--green-light);"></i>Email</span>
          <span class="info-value" id="infoEmail">—</span>
        </div>
        <div class="info-row">
          <span class="info-label"><i class="fas fa-map-marker-alt" style="margin-right:0.4rem;color:var(--green-light);"></i>Location</span>
          <span class="info-value" id="infoLocation">—</span>
        </div>
        <div class="info-row">
          <span class="info-label"><i class="fas fa-phone" style="margin-right:0.4rem;color:var(--green-light);"></i>Phone</span>
          <span class="info-value" id="infoPhone">—</span>
        </div>
        <div class="info-row">
          <span class="info-label"><i class="fas fa-id-badge" style="margin-right:0.4rem;color:var(--green-light);"></i>Account Type</span>
          <span class="info-value" id="infoRole">—</span>
        </div>
      </div>

      <div style="display:flex;flex-direction:column;gap:0.75rem;margin-top:1.25rem;">
        <button id="editProfileBtn" class="btn btn-secondary" style="justify-content:center;"><i class="fas fa-pen"></i> Edit Profile</button>
        <button id="changePasswordBtn" class="btn btn-secondary" style="justify-content:center;"><i class="fas fa-lock"></i> Change Password</button>
        <a id="dashLink" href="browse.html" class="btn btn-green" style="justify-content:center;"><i class="fas fa-th-large"></i> Go to Dashboard</a>
        <button onclick="logout()" class="btn" style="justify-content:center;background:#ffe4e4;color:#c0392b;"><i class="fas fa-sign-out-alt"></i> Logout</button>
        <button id="deleteAccountBtn" class="btn" style="justify-content:center;background:transparent;color:#999;font-size:0.85rem;border:1px solid #ddd;"><i class="fas fa-trash"></i> Delete Account</button>
      </div>
    </div>
  </div>

  <!-- ══ EDIT PROFILE MODAL ══ -->
  <div class="modal-overlay" id="editProfileModal">
    <div class="modal" style="max-width:500px;">
      <div class="modal-header">
        <h2><i class="fas fa-user-pen" style="margin-right:0.5rem;color:var(--green-light);"></i>Edit Profile</h2>
        <button class="modal-close" id="closeEditProfileModal"><i class="fas fa-times"></i></button>
      </div>
      <form id="editProfileForm" novalidate>
        <div class="form-group">
          <label for="editName">Full Name <span style="color:#e74c3c;">*</span></label>
          <input type="text" id="editName" class="form-control" placeholder="Your full name">
        </div>
        <div class="form-group">
          <label for="editEmail">Email</label>
          <input type="email" id="editEmail" class="form-control" placeholder="your@email.com">
        </div>
        <div class="form-group">
          <label for="editLocation">Location</label>
          <input type="text" id="editLocation" class="form-control" placeholder="e.g. Toril, Davao City">
        </div>
        <div class="form-group">
          <label for="editPhone">Phone Number</label>
          <input type="tel" id="editPhone" class="form-control" placeholder="e.g. 09XXXXXXXXX">
        </div>
        <div style="display:flex;gap:0.75rem;margin-top:0.5rem;">
          <button type="submit" class="btn btn-green" style="flex:1;justify-content:center;"><i class="fas fa-check"></i> Save Changes</button>
          <button type="button" id="cancelEditProfile" class="btn btn-secondary" style="flex:1;justify-content:center;">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ══ CHANGE PASSWORD MODAL ══ -->
  <div class="modal-overlay" id="changePasswordModal">
    <div class="modal" style="max-width:420px;">
      <div class="modal-header">
        <h2><i class="fas fa-lock" style="margin-right:0.5rem;color:var(--green-light);"></i>Change Password</h2>
        <button class="modal-close" id="closePasswordModal"><i class="fas fa-times"></i></button>
      </div>
      <form id="changePasswordForm" novalidate>
        <div class="form-group">
          <label for="newPassword">New Password <span style="color:#e74c3c;">*</span></label>
          <input type="password" id="newPassword" class="form-control" placeholder="At least 6 characters">
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirm Password <span style="color:#e74c3c;">*</span></label>
          <input type="password" id="confirmPassword" class="form-control" placeholder="Repeat new password">
        </div>
        <div style="display:flex;gap:0.75rem;margin-top:0.5rem;">
          <button type="submit" class="btn btn-green" style="flex:1;justify-content:center;"><i class="fas fa-check"></i> Update Password</button>
          <button type="button" id="cancelPassword" class="btn btn-secondary" style="flex:1;justify-content:center;">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ══ CONFIRM MODAL ══ -->
  <div class="modal-overlay" id="confirmModal">
    <div class="modal" style="max-width:400px;text-align:center;position:relative;">
      <button class="modal-close" id="closeConfirmModal" style="position:absolute;top:1.25rem;right:1.5rem;"><i class="fas fa-times"></i></button>
      <span style="font-size:2.5rem;display:block;margin-bottom:0.75rem;">⚠️</span>
      <h2 id="confirmModalTitle" style="font-family:'Raleway',sans-serif;font-size:1.1rem;color:var(--green-dark);margin-bottom:0.5rem;">Are you sure?</h2>
      <p id="confirmModalMessage" style="color:var(--text-light);font-size:0.9rem;margin-bottom:1.25rem;"></p>
      <button id="confirmModalAction" class="btn btn-green btn-block" style="justify-content:center;">Confirm</button>
      <button id="cancelConfirmModal" class="btn btn-secondary btn-block" style="margin-top:0.5rem;justify-content:center;">Cancel</button>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
