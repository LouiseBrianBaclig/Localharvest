<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Green circle background -->
  <circle cx="32" cy="32" r="32" fill="#1a5c38"/>

  <!-- Wheat stalk: main stem -->
  <line x1="32" y1="54" x2="32" y2="14" stroke="#f5c842" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Wheat head: top grain (center) -->
  <ellipse cx="32" cy="14" rx="3.5" ry="5.5" fill="#f5c842" transform="rotate(0,32,14)"/>

  <!-- Left grains -->
  <ellipse cx="26.5" cy="18.5" rx="3" ry="5" fill="#f5c842" transform="rotate(-28,26.5,18.5)"/>
  <ellipse cx="23.5" cy="24.5" rx="2.8" ry="4.6" fill="#e8b832" transform="rotate(-34,23.5,24.5)"/>

  <!-- Right grains -->
  <ellipse cx="37.5" cy="18.5" rx="3" ry="5" fill="#f5c842" transform="rotate(28,37.5,18.5)"/>
  <ellipse cx="40.5" cy="24.5" rx="2.8" ry="4.6" fill="#e8b832" transform="rotate(34,40.5,24.5)"/>

  <!-- Left lower grains -->
  <ellipse cx="25" cy="30" rx="2.5" ry="4.2" fill="#e8b832" transform="rotate(-38,25,30)"/>
  <!-- Right lower grains -->
  <ellipse cx="39" cy="30" rx="2.5" ry="4.2" fill="#e8b832" transform="rotate(38,39,30)"/>

  <!-- Small leaf on stem -->
  <path d="M32 40 Q22 36 20 30 Q26 32 32 40Z" fill="#52b788" opacity="0.9"/>
  <path d="M32 40 Q42 36 44 30 Q38 32 32 40Z" fill="#40916c" opacity="0.9"/>

  <!-- Stalk curve at base -->
  <path d="M32 54 Q28 50 26 46" stroke="#f5c842" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.6"/>
</svg>
