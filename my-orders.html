<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Favicons -->
  <link rel="icon" type="image/x-icon"    href="favicon.ico">
  <link rel="icon" type="image/svg+xml"   href="favicon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="favicon-512.png">
  <link rel="apple-touch-icon" sizes="180x180"      href="apple-touch-icon.png">
  <meta name="theme-color" content="#1a5c38">
  <title>My Orders – LocalHarvest</title>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600;700;800&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="my-orders">

  <nav class="navbar" id="navbar">
    <div class="nav-container">
      <div class="nav-brand">
        <a href="index.html" style="text-decoration:none;display:flex;align-items:center;gap:0.5rem;">
          <span class="brand-icon">🌾</span><span class="brand-name">LocalHarvest</span>
        </a>
      </div>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle menu"><i class="fas fa-bars"></i></button>
      <ul class="nav-links" id="navLinks">
        <li><a href="browse.html">Browse</a></li>
        <li><a href="profile.html">Profile</a></li>
        <li class="nav-divider"></li>
        <li><button id="logoutBtn" class="nav-btn btn-outline">Logout</button></li>
      </ul>
    </div>
  </nav>

  <div class="orders-page">

    <!-- ── Hero Banner ── -->
    <div class="orders-hero">
      <div class="orders-hero-inner">
        <div class="orders-hero-text">
          <div class="orders-hero-icon"><i class="fas fa-box-open"></i></div>
          <div>
            <h1>My Order History</h1>
            <p>Track all the products you've ordered from local farmers</p>
          </div>
        </div>
        <a href="browse.html" class="btn btn-primary orders-hero-btn">
          <i class="fas fa-shopping-basket"></i> Order More
        </a>
      </div>
    </div>

    <div class="orders-body">

      <!-- ── Stats ── -->
      <div class="orders-stats">
        <div class="order-stat-card">
          <div class="order-stat-icon" style="background:#e8f5e9;color:var(--green-dark);"><i class="fas fa-receipt"></i></div>
          <div class="order-stat-num" id="totalOrdersCount">0</div>
          <div class="order-stat-label">Total Orders</div>
        </div>
        <div class="order-stat-card">
          <div class="order-stat-icon" style="background:#fff3e0;color:var(--accent-dark);"><i class="fas fa-peso-sign"></i></div>
          <div class="order-stat-num" id="totalSpent">₱0</div>
          <div class="order-stat-label">Total Spent</div>
        </div>
        <div class="order-stat-card">
          <div class="order-stat-icon" style="background:#e3f2fd;color:#1565c0;"><i class="fas fa-tractor"></i></div>
          <div class="order-stat-num" id="uniqueFarmers">0</div>
          <div class="order-stat-label">Farmers Supported</div>
        </div>
        <div class="order-stat-card">
          <div class="order-stat-icon" style="background:#fce4ec;color:#c62828;"><i class="fas fa-clock"></i></div>
          <div class="order-stat-num" id="pendingCount">0</div>
          <div class="order-stat-label">Pending Pickup</div>
        </div>
      </div>

      <!-- ── Filters + Search ── -->
      <div class="orders-filter-bar">
        <div class="orders-tabs">
          <button class="order-tab active" data-filter="all">
            <i class="fas fa-list"></i> All Orders
          </button>
          <button class="order-tab" data-filter="pending">
            <i class="fas fa-clock"></i> Pending
          </button>
          <button class="order-tab" data-filter="completed">
            <i class="fas fa-check-circle"></i> Completed
          </button>
          <button class="order-tab" data-filter="cancelled">
            <i class="fas fa-times-circle"></i> Cancelled
          </button>
        </div>
        <div class="orders-search-wrap">
          <i class="fas fa-search orders-search-icon"></i>
          <input type="text" id="orderSearch" class="orders-search-input" placeholder="Search product or farmer…">
        </div>
      </div>

      <!-- ── Orders List ── -->
      <div id="ordersList"></div>

    </div>
  </div>

  <!-- ══ ORDER DETAIL MODAL ══ -->
  <div class="modal-overlay" id="orderDetailModal">
    <div class="modal" style="max-width:500px;">
      <div class="modal-header">
        <h2><i class="fas fa-receipt" style="margin-right:0.5rem;color:var(--green-light);"></i>Order Details</h2>
        <button class="modal-close" id="closeOrderDetail"><i class="fas fa-times"></i></button>
      </div>
      <div id="orderDetailContent"></div>
    </div>
  </div>

  <!-- ══ CONFIRM MODAL ══ -->
  <div class="modal-overlay" id="confirmModal">
    <div class="modal" style="max-width:400px;text-align:center;position:relative;">
      <button class="modal-close" id="closeConfirmModal" style="position:absolute;top:1.25rem;right:1.5rem;"><i class="fas fa-times"></i></button>
      <span style="font-size:2.5rem;display:block;margin-bottom:0.75rem;">⚠️</span>
      <h2 id="confirmModalTitle" style="font-family:'Raleway',sans-serif;font-size:1.1rem;color:var(--green-dark);margin-bottom:0.5rem;">Are you sure?</h2>
      <p id="confirmModalMessage" style="color:var(--text-light);font-size:0.9rem;margin-bottom:1.25rem;"></p>
      <button id="confirmModalAction" class="btn btn-green btn-block" style="justify-content:center;">Confirm</button>
      <button id="cancelConfirmModal" class="btn btn-secondary btn-block" style="margin-top:0.5rem;justify-content:center;">Cancel</button>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
